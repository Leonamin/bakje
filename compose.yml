name: bakje

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: .
      target: runner
    image: bakje-web:latest
    env_file:
      - ${ARCHIVE_CONFIG_DIR:-/etc/bakje}/bakje.env
    environment:
      ARCHIVE_DATA_DIR: /data
      ARCHIVE_NO_SANDBOX: "1"
      EMBEDDER_URL: http://embedder:8000
      HOME: /tmp
    volumes:
      - /var/lib/bakje:/data
    ports:
      - "127.0.0.1:3020:3000"
    restart: unless-stopped
    shm_size: "256m"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  # Semantic-search embeddings. Holds the model resident (~3.6GB RAM) and is
  # reachable only from the web service over the compose network.
  embedder:
    build: ./embedder
    image: bakje-embedder:latest
    environment:
      EMBED_THREADS: "8"
    volumes:
      - ${ARCHIVE_DATA_DIR:-/var/lib/bakje}/models:/models
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 6g
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging: *default-logging
