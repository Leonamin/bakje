name: post-archive

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    build:
      context: .
      target: runner
    image: post-archive-web:latest
    env_file:
      - ${ARCHIVE_CONFIG_DIR:-/etc/post-archive}/post-archive.env
    environment:
      ARCHIVE_DATA_DIR: /data
      ARCHIVE_NO_SANDBOX: "1"
      HOME: /tmp
    volumes:
      - /var/lib/post-archive:/data
    ports:
      - "127.0.0.1:3020:3000"
    restart: unless-stopped
    shm_size: "256m"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
